name: Update YouTube views

on:
  schedule:
    - cron: "0 14 * * *" # 21:00 เวลาไทย ทุกวัน
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch YouTube views
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/fetch-youtube.mjs
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "views-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/videos.json
            git commit -m "chore: update YouTube views"
            git push
          else
            echo "No changes"
          fi
